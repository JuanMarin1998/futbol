{% extends "estadisticas/base.html" %}
{% block titulo %}🟢 LIVE Ecuabet · Fútbol Stats{% endblock %}
{% block contenido %}
<style>
.ec-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.ec-status{color:#94a3b8;font-size:.9rem}
.ec-btn{background:#334155;color:#fff;border:0;border-radius:7px;padding:.55rem .8rem;cursor:pointer}
.ec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.65rem}
.ec-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:.8rem;transition:border-color .15s,background .15s}
.ec-card:hover{border-color:#64748b;background:#243247}
.ec-match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.65rem;align-items:center}
.ec-team{font-weight:750;font-size:.95rem;overflow-wrap:anywhere}
.ec-away{text-align:right}
.ec-center{text-align:center;min-width:76px}
.ec-score{font-size:1.25rem;font-weight:900;white-space:nowrap}
.ec-minute{color:#f87171;font-size:.8rem;margin-top:.15rem;white-space:nowrap}
.ec-empty{grid-column:1/-1;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:2rem;text-align:center;color:#94a3b8}
@media(max-width:480px){.ec-grid{grid-template-columns:1fr}.ec-team{font-size:.88rem}.ec-match{gap:.4rem}.ec-center{min-width:64px}.ec-score{font-size:1.1rem}}
</style>
<div class="ec-head"><div><h2 style="margin:.2rem 0">🟢 LIVE Ecuabet</h2><div class="ec-status" id="status">Cargando eventos en vivo...</div></div><button class="ec-btn" onclick="cargarEcuabetLive()">Actualizar ahora</button></div>
<div id="events" class="ec-grid"></div>
<script>
const POLL_MS={{ live_poll_ms }};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderEvent(e){
  const teams=e.competitors||[], parts=(e.name||'').split(/\s+vs\.?\s+/i);
  const home=teams[0]?.name||parts[0]||'Local', away=teams[1]?.name||parts[1]||'Visitante', score=e.score||[];
  const minute=e.live_time||e.live_status||'LIVE';
  return '<a class="ec-card" href="/live/ecuabet/'+encodeURIComponent(e.id)+'/" style="text-decoration:none;color:inherit;display:block" aria-label="'+esc(home)+' '+(score[0]??0)+' a '+(score[1]??0)+' '+esc(away)+', '+esc(minute)+'"><div class="ec-match"><div class="ec-team">'+esc(home)+'</div><div class="ec-center"><div class="ec-score">'+(score[0]??0)+' - '+(score[1]??0)+'</div><div class="ec-minute">'+esc(minute)+'</div></div><div class="ec-team ec-away">'+esc(away)+'</div></div></a>';
}
async function cargarEcuabetLive(){const s=document.getElementById('status');s.textContent='Actualizando Ecuabet...';try{const r=await fetch("{% url 'estadisticas:api_ecuabet_live' %}",{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error consultando Ecuabet');const box=document.getElementById('events');box.innerHTML=d.events.length?d.events.map(renderEvent).join(''):'<div class="ec-empty">No hay partidos en vivo en Ecuabet en este momento.</div>';s.textContent=d.count+' evento(s) en vivo · actualización '+new Date().toLocaleTimeString();}catch(err){s.textContent='No fue posible obtener Ecuabet.';document.getElementById('events').innerHTML='<div class="ec-empty">'+esc(err.message)+'</div>';}}
cargarEcuabetLive();setInterval(cargarEcuabetLive,POLL_MS);
</script>
{% endblock %}
