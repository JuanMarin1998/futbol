{% extends "estadisticas/base.html" %}
{% block titulo %}🟢 LIVE Ecuabet · Fútbol Stats{% endblock %}
{% block contenido %}
<style>
.ec-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}.ec-status{color:#94a3b8;font-size:.9rem}.ec-actions{display:flex;gap:.5rem;align-items:center}.ec-btn{background:#334155;color:#fff;border:0;border-radius:7px;padding:.55rem .8rem;cursor:pointer}.ec-grid{display:grid;gap:1rem}.ec-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1rem}.ec-match{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;margin-bottom:1rem}.ec-team{font-weight:800;font-size:1rem}.ec-away{text-align:right}.ec-score{text-align:center;font-size:1.45rem;font-weight:900}.ec-minute{text-align:center;color:#f87171;font-size:.8rem;margin-top:.2rem}.ec-meta{display:flex;gap:.5rem;flex-wrap:wrap;color:#94a3b8;font-size:.78rem;margin-bottom:.9rem}.ec-pill{background:#0f172a;border:1px solid #334155;border-radius:999px;padding:.25rem .55rem}.ec-market{border:1px solid #334155;border-radius:9px;margin-top:.75rem;overflow:hidden}.ec-market-title{padding:.65rem .75rem;background:#0f172a;font-weight:700;display:flex;justify-content:space-between;gap:.5rem}.ec-table{width:100%;border-collapse:collapse}.ec-table th,.ec-table td{padding:.48rem .6rem;border-bottom:1px solid #334155;text-align:left;font-size:.82rem}.ec-table th{color:#94a3b8;font-size:.7rem;text-transform:uppercase}.ec-price{font-weight:800}.ec-off{color:#fca5a5}.ec-empty{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:2rem;text-align:center;color:#94a3b8}@media(max-width:650px){.ec-match{gap:.45rem}.ec-team{font-size:.9rem}.ec-table th:nth-child(4),.ec-table td:nth-child(4){display:none}}
</style>
<div class="ec-head"><div><h2 style="margin:.2rem 0">🟢 LIVE Ecuabet</h2><div class="ec-status" id="status">Cargando eventos en vivo...</div></div><button class="ec-btn" onclick="cargarEcuabetLive()">Actualizar ahora</button></div>
<div id="events" class="ec-grid"></div>
<script>
const POLL_MS={{ live_poll_ms }};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function fmtPrice(v){return v===null||v===undefined?'—':Number(v).toFixed(4).replace(/0+$/,'').replace(/\.$/,'');}
function renderEvent(e){
  const teams=e.competitors||[], parts=e.name.split(/\s+vs\.?\s+/i);
  const home=teams[0]?.name||parts[0]||'Local', away=teams[1]?.name||parts[1]||'Visitante', score=e.score||[];
  const markets=(e.markets||[]).filter(m=>(m.selections||[]).length);
  return '<article class="ec-card"><div class="ec-match"><div class="ec-team">'+esc(home)+'</div><div><div class="ec-score">'+(score[0]??0)+' - '+(score[1]??0)+'</div><div class="ec-minute">'+esc(e.live_time||e.live_status||'LIVE')+'</div></div><div class="ec-team ec-away">'+esc(away)+'</div></div>'+
  '<div class="ec-meta"><span class="ec-pill">🔴 '+esc(e.live_status||'En vivo')+'</span><span class="ec-pill">🏆 '+esc(e.champ?.name||'')+'</span><span class="ec-pill">⚽ '+esc(e.sport?.name||'')+'</span><span class="ec-pill">ID '+esc(e.id)+'</span></div>'+
  (markets.length?markets.map(m=>'<section class="ec-market"><div class="ec-market-title"><span>'+esc(m.name)+(m.line?' · '+esc(m.line):'')+'</span><span>'+m.selections.length+' cuotas</span></div><table class="ec-table"><thead><tr><th>Selección</th><th>Cuota</th><th>Tipo</th><th>ID</th></tr></thead><tbody>'+m.selections.map(o=>'<tr><td>'+esc(o.name)+'</td><td class="ec-price '+(o.odd_status!==0?'ec-off':'')+'">'+fmtPrice(o.price)+'</td><td>'+esc(o.type_id)+'</td><td>'+esc(o.id)+'</td></tr>').join('')+'</tbody></table></section>').join(''):'<div class="ec-empty">Ecuabet no entregó mercados/cuotas para este evento.</div>')+'</article>';
}
async function cargarEcuabetLive(){const s=document.getElementById('status');s.textContent='Actualizando Ecuabet...';try{const r=await fetch("{% url 'estadisticas:api_ecuabet_live' %}",{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error consultando Ecuabet');const box=document.getElementById('events');box.innerHTML=d.events.length?d.events.map(renderEvent).join(''):'<div class="ec-empty">No hay partidos en vivo en Ecuabet en este momento.</div>';s.textContent=d.count+' evento(s) en vivo · actualización '+new Date().toLocaleTimeString();}catch(err){s.textContent='No fue posible obtener Ecuabet.';document.getElementById('events').innerHTML='<div class="ec-empty">'+esc(err.message)+'</div>';}}
cargarEcuabetLive();setInterval(cargarEcuabetLive,POLL_MS);
</script>
{% endblock %}
