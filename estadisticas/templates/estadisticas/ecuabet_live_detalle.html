{% extends "estadisticas/base.html" %}
{% block titulo %}🟢 Partido LIVE · Ecuabet + Estadísticas{% endblock %}
{% block contenido %}
<style>
.ld-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.ld-btn{background:#334155;color:#fff;border:0;border-radius:8px;padding:.6rem .9rem;cursor:pointer}
.ld-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:1rem}
.ld-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1rem}
.ld-score{text-align:center;font-size:2rem;font-weight:900}
.ld-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}
.ld-team{font-weight:800;font-size:1.05rem}.ld-away{text-align:right}
.ld-minute{text-align:center;color:#f87171;font-weight:700}
.ld-section{margin-top:1rem}.ld-title{font-size:1rem;font-weight:800;margin-bottom:.65rem}
.ld-market{border:1px solid #334155;border-radius:9px;margin-bottom:.7rem;overflow:hidden}
.ld-market h4{margin:0;padding:.6rem .7rem;background:#0f172a}
.ld-table{width:100%;border-collapse:collapse}.ld-table td{padding:.5rem .65rem;border-bottom:1px solid #334155}
.ld-price{font-weight:900;text-align:right}
.stat-grid{display:grid;gap:.55rem}.ld-stat-group{margin-bottom:1rem}.ld-stat-group:last-child{margin-bottom:0}.ld-stat-group-title{font-size:.88rem;font-weight:900;color:#e2e8f0;padding:.55rem .65rem;background:#0f172a;border-radius:8px;margin-bottom:.45rem}.stat-row{display:grid;grid-template-columns:1fr 55px 1fr;gap:.5rem;align-items:center}
.stat-val{text-align:center;font-weight:800}.stat-label{text-align:center;color:#94a3b8;font-size:.78rem}
.bar{height:5px;background:#0f172a;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:#64748b}
.ld-muted{color:#94a3b8;font-size:.85rem}.ld-back{color:#60a5fa;text-decoration:none}
@media(max-width:800px){.ld-layout{grid-template-columns:1fr}}
</style>

<div class="ld-head">
  <div><a class="ld-back" href="{% url 'estadisticas:ecuabet_live' %}">← Partidos LIVE</a><h2 style="margin:.35rem 0">🟢 Partido en vivo</h2></div>
  <button class="ld-btn" onclick="cargar()">Actualizar ahora</button>
</div>

<div id="match"><div class="ld-card ld-muted">Cargando partido...</div></div>

<script>
const EVENT_ID={{ ecuabet_event_id }};
const POLL_MS={{ live_poll_ms }};

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function price(v){return v==null?'—':Number(v).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');}
function statValue(side,type){return side?.[type]?.value ?? null;}
function statText(side,type){
  const item=side?.[type];
  if(!item)return '—';
  return item.raw_value ?? item.value ?? '—';
}
function statDisplayName(home,away,type){
  return home?.[type]?.label || away?.[type]?.label || home?.[type]?.name || away?.[type]?.name || type;
}
function statGroupName(home,away,type){
  return home?.[type]?.group || away?.[type]?.group || 'Estadísticas';
}

function renderStats(stats){
  const home=stats?.home||{}, away=stats?.away||{};
  const types=[...new Set([...(stats?.raw_types||[]),...Object.keys(home),...Object.keys(away)])];
  if(!types.length)return '<div class="ld-muted">Aún no hay estadísticas de Flashscore para este partido.</div>';

  const groups={};
  types.forEach(type=>{
    const group=statGroupName(home,away,type);
    if(!groups[group])groups[group]=[];
    groups[group].push(type);
  });

  const groupOrder=['General','Shots','Attack','Passes','Defense','Goalkeeping','Discipline','Estadísticas'];
  const orderedGroups=Object.entries(groups).sort((a,b)=>{
    const ai=groupOrder.indexOf(a[0]), bi=groupOrder.indexOf(b[0]);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });

  return orderedGroups.map(([group,groupTypes])=>
    '<div class="ld-stat-group"><div class="ld-stat-group-title">'+esc(group)+'</div>'+
    '<div class="stat-grid">'+groupTypes.map(type=>{
      const a=statText(home,type), b=statText(away,type);
      const label=statDisplayName(home,away,type);
      return '<div class="stat-row"><div style="text-align:right;font-weight:800">'+esc(a)+'</div><div class="stat-label">'+esc(label)+'</div><div style="font-weight:800">'+esc(b)+'</div></div>';
    }).join('')+'</div></div>'
  ).join('');
}

function render(e, flash){
  const teams=e.competitors||[], parts=(e.name||'').split(/\s+vs\.?\s+/i);
  const home=teams[0]?.name||parts[0]||'Local', away=teams[1]?.name||parts[1]||'Visitante', score=e.score||[];
  const markets=e.markets||[];
  let stats=flash?.performance;
  return '<div class="ld-layout">'+
    '<main><div class="ld-card"><div class="ld-teams"><div class="ld-team">'+esc(home)+'</div><div><div class="ld-score">'+(score[0]??0)+' - '+(score[1]??0)+'</div><div class="ld-minute">'+esc(e.liveTime||e.live_time||e.live_status||'LIVE') + (e.ls ? '<div class="ld-muted" style="font-size:.78rem">'+esc(e.ls)+'</div>' : '')+'</div></div><div class="ld-team ld-away">'+esc(away)+'</div></div><div class="ld-muted" style="text-align:center;margin-top:.7rem">'+esc(e.champ?.name||'')+'</div></div>'+
    '<div class="ld-card ld-section"><div class="ld-title">📊 Estadísticas en línea</div>'+renderStats(stats)+'</div></main>'+
    '<aside><div class="ld-card"><div class="ld-title">💰 Cuotas Ecuabet</div>'+ (markets.length?markets.map(m=>'<div class="ld-market"><h4>'+esc(m.name)+(m.line?' · '+esc(m.line):'')+'</h4>'+m.selections.map(o=>'<div style="display:flex;justify-content:space-between;padding:.55rem .7rem;border-bottom:1px solid #334155"><span>'+esc(o.name)+'</span><span class="ld-price">'+price(o.price)+'</span></div>').join('')+'</div>').join(''):'<div class="ld-muted">Sin mercados disponibles.</div>')+'</div>'+
    '<div class="ld-card ld-section"><div class="ld-title">🔗 Fuente estadística</div>'+ (flash?'<div class="ld-muted">Flashscore conectado · ID '+esc(flash.flashscore_event_id)+'</div>':'<div class="ld-muted">El partido está seleccionado, pero aún falta vincular su ID de Flashscore.</div>')+'</div></aside></div>';
}

async function cargar(){
  try{
    const r=await fetch("{% url 'estadisticas:api_ecuabet_live_detalle' ecuabet_event_id %}",{cache:'no-store'});
    const d=await r.json(); if(!r.ok||!d.ok)throw new Error(d.error||'No disponible');
    const flash=d.match || null;
    document.getElementById('match').innerHTML=render(d.event,flash);
  }catch(err){document.getElementById('match').innerHTML='<div class="ld-card ld-muted">'+esc(err.message)+'</div>';}
}
cargar();setInterval(cargar,POLL_MS);
</script>
{% endblock %}
