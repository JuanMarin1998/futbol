{% extends "estadisticas/base.html" %}
{% block titulo %}🔴 LIVE · Fútbol Stats{% endblock %}
{% block contenido %}
<style>
.live-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}.live-status{color:#94a3b8;font-size:.9rem}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}.live-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1rem;text-decoration:none;color:#e2e8f0;display:block;transition:.15s}.live-card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.live-league{font-size:.78rem;color:#94a3b8;margin-bottom:1rem}.live-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center}.team-name{font-weight:700}.team-name.away{text-align:right}.live-score{text-align:center;font-size:1.4rem;font-weight:800}.live-minute{text-align:center;color:#f87171;font-size:.78rem;margin-top:.2rem}.empty{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:2rem;text-align:center;color:#94a3b8}.live-button{background:#334155;color:#fff;border:0;border-radius:7px;padding:.55rem .8rem;cursor:pointer}
</style>
<div class="live-head"><div><h2 style="margin:.2rem 0">🔴 LIVE</h2><div class="live-status" id="status">Cargando partidos...</div></div><button class="live-button" onclick="cargarEnVivo()">Actualizar ahora</button></div>
<div id="matches"></div>
<script>
const POLL_MS={{ live_poll_ms }};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function cargarEnVivo(){const s=document.getElementById('status');s.textContent='Actualizando...';try{const r=await fetch("{% url 'estadisticas:api_live' %}",{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');const box=document.getElementById('matches');if(!d.matches.length){box.innerHTML='<div class="empty">No hay partidos en vivo en este momento.</div>';}else{box.innerHTML='<div class="live-grid">'+d.matches.map(m=>'<a class="live-card" href="/live/'+m.id+'/"><div class="live-league">'+esc(m.league)+' · '+esc(m.country)+'</div><div class="live-teams"><div class="team-name">'+esc(m.home)+'</div><div><div class="live-score">'+(m.home_goals??0)+' - '+(m.away_goals??0)+'</div><div class="live-minute">'+esc(m.elapsed??m.status)+(m.elapsed?"'":'')+'</div></div><div class="team-name away">'+esc(m.away)+'</div></div></a>').join('')+'</div>';}s.textContent=d.count+' partido(s) en vivo · '+new Date().toLocaleTimeString();}catch(e){s.textContent='No fue posible obtener los datos.';document.getElementById('matches').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
cargarEnVivo();setInterval(cargarEnVivo,POLL_MS);
</script>
{% endblock %}
