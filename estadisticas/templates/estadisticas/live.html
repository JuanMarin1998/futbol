<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos en vivo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #17202a; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
        .header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; }
        .status { font-size:14px; color:#566573; }
        .match { background:white; border-radius:12px; padding:18px; margin:12px 0; box-shadow:0 2px 8px rgba(0,0,0,.07); }
        .league { font-size:13px; color:#566573; margin-bottom:12px; }
        .teams { display:grid; grid-template-columns:1fr 80px 1fr; align-items:center; gap:12px; }
        .team { font-weight:700; } .away { text-align:right; }
        .score { text-align:center; font-size:24px; font-weight:800; }
        .minute { text-align:center; font-size:12px; color:#c0392b; margin-top:5px; }
        .empty { background:white; padding:30px; border-radius:12px; text-align:center; }
        button { border:0; border-radius:8px; padding:10px 14px; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div><h1>⚽ Partidos en vivo</h1><div class="status" id="status">Cargando...</div></div>
        <button onclick="cargarEnVivo()">Actualizar ahora</button>
    </div>
    <div id="matches"></div>
</div>
<script>
const POLL_MS = {{ live_poll_ms }};
function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c]));
}
async function cargarEnVivo() {
    const status = document.getElementById("status");
    status.textContent = "Consultando API...";
    try {
        const response = await fetch("{% url \"estadisticas:api_live\" %}", {cache: "no-store"});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Error consultando datos");
        const matches = document.getElementById("matches");
        if (!data.matches.length) {
            matches.innerHTML = '<div class="empty">No hay partidos en vivo en este momento.</div>';
        } else {
            matches.innerHTML = data.matches.map(m =>
                '<div class="match"><div class="league">' + escapeHtml(m.league) + " · " + escapeHtml(m.country) + '</div>' +
                '<div class="teams"><div class="team">' + escapeHtml(m.home) + '</div>' +
                '<div><div class="score">' + m.home_goals + " - " + m.away_goals + '</div><div class="minute">' + escapeHtml(m.elapsed || m.status) + '</div></div>' +
                '<div class="team away">' + escapeHtml(m.away) + '</div></div></div>'
            ).join("");
        }
        status.textContent = data.count + " partido(s) · Última actualización: " + new Date().toLocaleTimeString();
    } catch (error) {
        status.textContent = "No fue posible obtener los datos en vivo.";
        document.getElementById("matches").innerHTML = '<div class="empty">' + escapeHtml(error.message) + '</div>';
    }
}
cargarEnVivo();
setInterval(cargarEnVivo, POLL_MS);
</script>
</body>
</html>
