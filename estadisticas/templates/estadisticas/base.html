<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Fútbol Stats{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1e293b;
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.3rem;
        }
        header h1 a {
            color: #e2e8f0;
            text-decoration: none;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: background 0.15s;
        }
        nav a:hover, nav a.activo {
            background: #334155;
            color: #fff;
        }
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem;
        }
        .tarjeta {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
        th {
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
        }
        .error {
            background: #450a0a;
            border: 1px solid #991b1b;
            color: #fecaca;
            padding: 1rem;
            border-radius: 8px;
        }
        .ligas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .liga-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: #e2e8f0;
            transition: border-color 0.15s, transform 0.15s;
        }
        .liga-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .resultado {
            font-weight: 700;
            color: #38bdf8;
        }
        .escudo {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 0.4rem;
        }
        .seccion-titulo {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.8rem;
        }
        .subnav {
            background: #0b1220;
            padding: 0.6rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 0.3rem;
        }
        .subnav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
        }
        .subnav a:hover, .subnav a.activo {
            background: #1e293b;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'estadisticas:inicio' %}">⚽ Fútbol Stats</a></h1>
        <nav>
            <a href="{% url 'estadisticas:partidos_en_vivo' %}" class="{% if seccion == 'live' %}activo{% endif %}">🔴 LIVE</a>
            <a href="{% url 'estadisticas:ecuabet_live' %}" class="{% if seccion == 'ecuabet_live' %}activo{% endif %}">🟢 LIVE Ecuabet</a>
            {% for codigo, nombre in ligas.items %}
                <a href="{% url 'estadisticas:partidos_liga' codigo %}" class="{% if codigo_liga == codigo %}activo{% endif %}">{{ nombre }}</a>
            {% endfor %}
        </nav>
    </header>
    {% if codigo_liga %}
    <div class="subnav">
        <a href="{% url 'estadisticas:partidos_liga' codigo_liga %}" class="{% if seccion == 'partidos' %}activo{% endif %}">Partidos</a>
        <a href="{% url 'estadisticas:tabla_liga' codigo_liga %}" class="{% if seccion == 'tabla' %}activo{% endif %}">Tabla</a>
        <a href="{% url 'estadisticas:goleadores_liga' codigo_liga %}" class="{% if seccion == 'goleadores' %}activo{% endif %}">Goleadores</a>
        <a href="{% url 'estadisticas:enfrentamiento' codigo_liga %}" class="{% if seccion == 'enfrentamiento' %}activo{% endif %}">Enfrentamiento directo</a>
    </div>
    {% endif %}
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
