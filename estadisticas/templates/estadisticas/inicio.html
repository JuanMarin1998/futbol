{% extends "estadisticas/base.html" %}
{% block titulo %}Fútbol Stats — Inicio{% endblock %}
{% block contenido %}
    <h2>Elige una liga</h2>
    <p style="color:#94a3b8;">Datos almacenados en PostgreSQL</p>
    <div class="ligas-grid">
        {% for codigo, nombre in ligas.items %}
            <a href="{% url 'estadisticas:partidos_liga' codigo %}" class="liga-card">
                <div style="font-size:1.1rem; font-weight:600;">{{ nombre }}</div>
                <div style="color:#64748b; font-size:0.85rem; margin-top:0.3rem;">{{ codigo }}</div>
            </a>
        {% endfor %}
    </div>
{% endblock %}
