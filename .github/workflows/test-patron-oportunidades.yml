name: Validar Patrón de Oportunidades

on:
  push:
    branches:
      - experimento/patron-oportunidades
  pull_request:
    branches:
      - experimento/patron-oportunidades
    paths:
      - "experimentos/patron_oportunidades/**"
      - ".github/workflows/test-patron-oportunidades.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ejecutar pruebas automáticas
        working-directory: experimentos/patron_oportunidades
        run: python -m unittest -q
      - name: Simular contexto previo y mostrar informe
        run: python experimentos/patron_oportunidades/simular_contexto.py
      - name: Simular escenarios del partido y mostrar informe
        run: python experimentos/patron_oportunidades/simular_patron.py
      - name: Ejecutar flujo integral sintético de contexto a reacción
        run: python experimentos/patron_oportunidades/simular_partido_completo.py
      - name: Probar cinco casos de Contexto frente a Acción
        run: python experimentos/patron_oportunidades/prueba_contexto_accion_5_casos.py
      - name: Simular cinco casos de Monitoreo activado por gol
        run: python experimentos/patron_oportunidades/simular_monitoreo_5_casos.py
      - name: Validar cadena completa de cinco partidos (Contexto a Acción)
        run: python experimentos/patron_oportunidades/simular_cadena_5_partidos.py
